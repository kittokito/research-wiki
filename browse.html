<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Wiki — 論文ブラウザ</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --ink:#1c1c1e; --muted:#6b7280; --line:#e5e7eb;
  --accent:#3b5bdb; --accent-weak:#eef1fd; --chip:#f1f3f5; --chip-on:#3b5bdb; --chip-on-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --bg:#16181d; --panel:#1e2127; --ink:#e6e7ea; --muted:#9aa0aa; --line:#2c3038;
  --accent:#7c93f5; --accent-weak:#232a44; --chip:#262a31; --chip-on:#7c93f5; --chip-on-ink:#16181d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 10px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.count{color:var(--muted);font-size:13px}
.spacer{flex:1}
.themebtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;
  padding:6px 10px;font-size:13px;cursor:pointer}
.searchrow{display:flex;gap:10px;align-items:center;padding-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:11px 38px 11px 38px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);
  cursor:pointer;border:0;background:none;font-size:16px;display:none}
select.sort{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px}
.filters{padding:0 0 12px}
.frow{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;margin:6px 0}
.flabel{font-size:12px;color:var(--muted);min-width:64px;padding-top:5px;user-select:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.reset{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:5px 4px}
.reset:hover{color:var(--accent);text-decoration:underline}
main{max-width:1180px;margin:18px auto 60px;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.b-cat{background:var(--accent-weak);color:var(--accent)}
.b-kind{background:var(--chip);color:var(--muted)}
.pr{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.pr-accepted{background:#e6f6ec;color:#1a7f43}
.pr-workshop{background:#e6f4f6;color:#0e7490}
.pr-under-review{background:#fdf3e0;color:#b7791f}
.pr-preprint{background:#eef0f2;color:#657084}
.pr-na{background:#f2f0f4;color:#8a8594}
html[data-theme="dark"] .pr-accepted{background:#123522;color:#4ade80}
html[data-theme="dark"] .pr-workshop{background:#0c2a30;color:#67e8f9}
html[data-theme="dark"] .pr-under-review{background:#332711;color:#fbbf24}
html[data-theme="dark"] .pr-preprint{background:#22262d;color:#9aa4b2}
html[data-theme="dark"] .pr-na{background:#26232c;color:#a29bad}
.card h2{font-size:15.5px;margin:0;line-height:1.35;font-weight:650}
.meta{font-size:12.5px;color:var(--muted)}
.desc{font-size:13px;color:var(--ink);opacity:.92}
.desc code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;color:var(--muted);background:var(--chip);border-radius:6px;padding:2px 7px;cursor:pointer}
.tag:hover{color:var(--accent)}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px;font-size:12.5px;
  border-top:1px dashed var(--line);padding-top:9px}
.empty{text-align:center;color:var(--muted);padding:70px 0;font-size:15px}
mark{background:#fff2a8;color:inherit;padding:0 1px;border-radius:2px}
html[data-theme="dark"] mark{background:#5c5220;color:#fff}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>📚 Research Wiki — 論文ブラウザ</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button class="themebtn" id="theme">🌓 テーマ</button>
    </div>
    <div class="searchrow">
      <div class="search">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="タイトル・著者・タグ・要約を横断検索（曖昧検索対応）  —  「/」でフォーカス" autocomplete="off">
        <button class="clear" id="clear" title="クリア">✕</button>
      </div>
      <select class="sort" id="sort">
        <option value="added">追加が新しい順</option>
        <option value="updated">更新が新しい順</option>
        <option value="year">発表年（新しい順）</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <div class="filters">
      <div class="frow">
        <span class="flabel">カテゴリ</span>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="frow">
        <span class="flabel">査読</span>
        <div class="chips" id="prChips"></div>
        <button class="reset" id="reset">フィルタをリセット</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">該当する論文がありません。検索語やフィルタを見直してください。</div>
</main>

const DATA = [{"title":"TabFM: A Zero-Shot Foundation Model for Tabular Data","aliases":["TabFM","tabular foundation model","zero-shot tabular"],"kind":"paper","category":"Technical_Report","authors":"Weihao Kong, Abhimanyu Das","year":2026,"venue":"","peer_review":"n/a","tags":["tabular-data","foundation-model","in-context-learning","zero-shot","synthetic-data","TabPFN","structural-causal-model"],"desc_html":"表形式データの分類・回帰を <strong>in-context learning<\/strong> として定式化、追加訓練・調整・特徴量エンジニアリング不要で<strong>単一 forward pass<\/strong> でゼロショット予測。alternating row/column attention + row compression + ICL の3機構、<strong>SCM 由来の数億の合成データのみ<\/strong>で事前学習、TabArena で教師あり定番手法を上回るトップ ELO。TabPFN/TabICL 系譜を統合し、CLIP 的な「基盤モデル＋ゼロショット転移」を表データに拡張 (Kong, Das et al., 2026 / Google Research)","desc_text":"表形式データの分類・回帰を in-context learning として定式化、追加訓練・調整・特徴量エンジニアリング不要で単一 forward pass でゼロショット予測。alternating row/column attention + row compression + ICL の3機構、SCM 由来の数億の合成データのみで事前学習、TabArena で教師あり定番手法を上回るトップ ELO。TabPFN/TabICL 系譜を統合し、CLIP(papers/Multimodal/clip.md) 的な「基盤モデル＋ゼロショット転移」を表データに拡張 (Kong, Das et al., 2026 / Google Research)","links":{"wiki":"wiki/papers/Technical_Report/tabfm.md","evidence":"evidence/Technical_Report/tabfm.md","source":"sources/Technical_Report/tabfm.md","url":"https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/"},"date_added":"2026-07-01","updated":"2026-07-01"},{"title":"One Single Hub Text Breaks CLIP: Identifying Vulnerabilities in Cross-Modal Encoders via Hubness","aliases":["Hub Text Breaks CLIP","hubness CLIP","single hub text"],"kind":"paper","category":"Multimodal","authors":"Hiroyuki Deguchi, Katsuki Chousa, Yusuke Sakai","year":2026,"venue":"ACL 2026 (Main)","peer_review":"accepted","tags":["CLIP","cross-modal-encoder","hubness","CLIPScore","image-text-retrieval","embedding-vulnerability","modality-gap","adversarial","multimodal"],"desc_html":"CLIP 系 cross-modal encoder の <strong>hubness 脆弱性<\/strong>を突く。無関係な多数画像と高類似度になる単一テキスト＝<s >コード50%混入で実効トークン2倍<\/strong>・フィルタはノイズデータのみ有効。Galactica 120B は過大と指摘 (Muennighoff, Rush, Barak, Raffel et al., 2023 / Hugging Face × Harvard × Turku)","desc_text":"上の To Repeat or Not To Repeat(papers/Pretraining/to-repeat-or-not-to-repeat.md) と同 NeurIPS 2023 の対ペア。400超の run（10M–8.7B・最大900Bトークン）で Chinchilla 則をデータ繰り返しに拡張した data-constrained scaling law を提案。Chinchilla の L=A/N^α+B/D^β+E を、繰り返しで価値が指数減衰する実効データ D'・実効パラメータ N' に置換（R\\_D≈15 が繰り返しの半減期）。【核心】最大~4エポックの繰り返しは新規データとほぼ同等、~16エポックまで有用、~40エポックで無価値。データ制約下では Chinchilla と異なり「パラメータよりエポックを速くスケール」（過剰パラメータは速く減衰 R\\_N<R\\_D、25Bユニークで27%少パラメータが上回る）。補完策としてコード50%混入で実効トークン2倍・フィルタはノイズデータのみ有効。Galactica 120B は過大と指摘 (Muennighoff, Rush, Barak, Raffel et al., 2023 / Hugging Face × Harvard × Turku)","links":{"wiki":"wiki/papers/Pretraining/scaling-data-constrained-language-models.md","evidence":"evidence/Pretraining/scaling-data-constrained-language-models.md","source":"sources/Pretraining/scaling-data-constrained-language-models.md","url":"https://arxiv.org/abs/2305.16264"},"date_added":"2026-06-19","updated":"2026-06-19"},{"title":"To Repeat or Not To Repeat: Insights from Scaling LLM under Token-Crisis","aliases":["To Repeat or Not To Repeat","Token-Crisis","Multi-Epoch Degradation","多エポック劣化"],"kind":"paper","category":"Pretraining","authors":"Fuzhao Xue, Yao Fu, Wangchunshu Zhou ほか","year":2023,"venue":"NeurIPS 2023 (Poster)","peer_review":"accepted","tags":["token-crisis","data-repetition","multi-epoch-degradation","overfitting","dropout","MoE","scaling-laws","pretraining","data-constrained"],"desc_html":"高品質テキストが枯渇する <strong>token-crisis<\/strong> 下で事前学習データを複数エポック<strong>繰り返す<\/strong>とどうなるかを T5/C4 で体系検証。<strong>データ繰り返しは過学習＝multi-epoch degradation（多エポック劣化）を招く<\/strong>。支配要因は<strong>データサイズ・パラメータ数・目的関数<\/strong>、影響小は<strong>データ品質・FLOPs<\/strong>（高品質 Wikipedia でも劣化は緩和されない）。大半の正則化が無効な中 <strong>dropout が極めて有効<\/strong>（後段投入＝dropstage、XL は追加チューニング要）。さらに <strong>MoE が同等パラメータ dense の過学習挙動を低コストで予測<\/strong>しハイパラ探索の安価な代理に。Knowledge Capacity（繰り返し露出を有益とする）の表裏で、RL Post-Training Scaling（RL では再利用が有効）とは符号が逆転 (Xue, Fu, Zhou, Zheng, You, 2023 / NUS × Edinburgh × ETH)","desc_text":"高品質テキストが枯渇する token-crisis 下で事前学習データを複数エポック繰り返すとどうなるかを T5/C4 で体系検証。データ繰り返しは過学習＝multi-epoch degradation（多エポック劣化）を招く。支配要因はデータサイズ・パラメータ数・目的関数、影響小はデータ品質・FLOPs（高品質 Wikipedia でも劣化は緩和されない）。大半の正則化が無効な中 dropout が極めて有効（後段投入＝dropstage、XL は追加チューニング要）。さらに MoE が同等パラメータ dense の過学習挙動を低コストで予測しハイパラ探索の安価な代理に。Knowledge Capacity(papers/Pretraining/knowledge-capacity-scaling-laws.md)（繰り返し露出を有益とする）の表裏で、RL Post-Training Scaling(papers/RL/rl-scaling-math-qwen25.md)（RL では再利用が有効）とは符号が逆転 (Xue, Fu, Zhou, Zheng, You, 2023 / NUS × Edinburgh × ETH)","links":{"wiki":"wiki/papers/Pretraining/to-repeat-or-not-to-repeat.md","evidence":"evidence/Pretraining/to-repeat-or-not-to-repeat.md","source":"sources/Pretraining/to-repeat-or-not-to-repeat.md","url":"https://arxiv.org/abs/2305.13230"},"date_added":"2026-06-19","updated":"2026-06-19"},{"title":"The Implications of Large-Scale Test-Time Compute","aliases":["Implications of Large-Scale Test-Time Compute","test-time compute implications","Noam Brown test-time compute"],"kind":"paper","category":"Inference_Decoding","authors":"Noam Brown","year":2026,"venue":"","peer_review":"n/a","tags":["test-time-compute","inference-scaling","reasoning","capability-ceiling","position-essay"],"desc_html":"Noam Brown（OpenAI）の論説。<strong>ベンチ成績がテスト時計算量に左右される度合いが増し、現代LLMの能力上限は未知<\/strong>と主張。test-time compute を第3のスケーリング軸と位置づける。Reasoning with Sampling/LLM-as-a-Verifier が具体手段、RLVR能力境界論争 の姉妹論点（※X article 本文未取得・テーゼのみ記録） (Noam Brown, 2026)","desc_text":"Noam Brown（OpenAI）の論説。ベンチ成績がテスト時計算量に左右される度合いが増し、現代LLMの能力上限は未知と主張。test-time compute を第3のスケーリング軸と位置づける。Reasoning with Sampling(papers/Inference_Decoding/reasoning-with-sampling.md)/LLM-as-a-Verifier(papers/Agent_ToolUse/llm-as-a-verifier.md) が具体手段、RLVR能力境界論争(topics/RL/rlvr-capability-boundary.md) の姉妹論点（※X article 本文未取得・テーゼのみ記録） (Noam Brown, 2026)","links":{"wiki":"wiki/papers/Inference_Decoding/implications-of-test-time-compute.md","evidence":"evidence/Inference_Decoding/implications-of-test-time-compute.md","source":"sources/Inference_Decoding/implications-of-test-time-compute.md","url":"https://x.com/polynoamial/status/2064210146558136827"},"date_added":"2026-06-11","updated":"2026-06-11"},{"title":"A Functional Taxonomy of World Models","aliases":["A Functional Taxonomy of World Models","world model taxonomy","renderer simulator planner"],"kind":"paper","category":"Physical_AI","authors":"Fei-Fei Li","year":2026,"venue":"","peer_review":"n/a","tags":["world-model","spatial-intelligence","renderer","simulator","planner","POMDP","JEPA","taxonomy"],"desc_html":"「world model」を機能で3分類: <strong>renderer<\/strong>（ピクセル観測・visual fidelity）/ <strong>simulator<\/strong>（幾何・物理・動力学的に忠実）/ <strong>planner<\/strong>（観測＋目標→action、renderer の逆関数）。<strong>POMDP の agent loop<\/strong> に位置づけ、「LM＝テキストの統計構造／world model＝空間と時間の統計構造」と対比。評価指標を <strong>visual quality→renderer・forward-prediction→simulator・decision→planner<\/strong> にマップし <strong>unified world model<\/strong> への収束を展望。本リポジトリの JEPA/world-model 群を読む座標系 (Fei-Fei Li, 2026 / World Labs)","desc_text":"「world model」を機能で3分類: renderer（ピクセル観測・visual fidelity）/ simulator（幾何・物理・動力学的に忠実）/ planner（観測＋目標→action、renderer の逆関数）。POMDP の agent loop に位置づけ、「LM＝テキストの統計構造／world model＝空間と時間の統計構造」と対比。評価指標を visual quality→renderer・forward-prediction→simulator・decision→planner にマップし unified world model への収束を展望。本リポジトリの JEPA/world-model 群を読む座標系 (Fei-Fei Li, 2026 / World Labs)","links":{"wiki":"wiki/papers/Physical_AI/a-functional-taxonomy-of-world-models.md","evidence":"evidence/Physical_AI/a-functional-taxonomy-of-world-models.md","source":"sources/Physical_AI/a-functional-taxonomy-of-world-models.md","url":"https://drfeifei.substack.com/p/a-functional-taxonomy-of-world-models"},"date_added":"2026-06-09","updated":"2026-06-09"},{"title":"Mitigate Negative Transfer with Similarity Heuristic Lifelong Prompt Tuning","aliases":["SHLPT","Similarity Heuristic Lifelong Prompt Tuning","lifelong prompt tuning negative transfer"],"kind":"paper","category":"Post_Training","authors":"Chenyuan Wu, Gangwei Jiang, Defu Lian","year":2024,"venue":"ACL 2024 Findings","peer_review":"accepted","tags":["prompt-tuning","PEFT","lifelong-learning","continual-learning","negative-transfer","catastrophic-forgetting"],"desc_html":"<strong>lifelong prompt tuning（PEFT × 継続学習）<\/strong>の <strong>negative transfer<\/strong> を緩和。<strong>学習可能な類似度メトリック<\/strong>でタスクを類似/非類似の2サブセットに分割し双方から有益な転移を引き出す＋<strong>parameter pool<\/strong> で catastrophic forgetting に対処、lifelong ベンチで SOTA 超。When Scaling Meets LLM Finetuning（PETの限界）/ DMT（忘却をデータ側で緩和）の継続学習・パラメータ側からの対 (Wu, Jiang, Lian, 2024)","desc_text":"lifelong prompt tuning（PEFT × 継続学習）の negative transfer を緩和。学習可能な類似度メトリックでタスクを類似/非類似の2サブセットに分割し双方から有益な転移を引き出す＋parameter pool で catastrophic forgetting に対処、lifelong ベンチで SOTA 超。When Scaling Meets LLM Finetuning(papers/Post_Training/scaling-llm-finetuning.md)（PETの限界）/ DMT(papers/Post_Training/sft-data-composition.md)（忘却をデータ側で緩和）の継続学習・パラメータ側からの対 (Wu, Jiang, Lian, 2024)","links":{"wiki":"wiki/papers/Post_Training/shlpt-lifelong-prompt-tuning.md","evidence":"evidence/Post_Training/shlpt-lifelong-prompt-tuning.md","source":"sources/Post_Training/shlpt-lifelong-prompt-tuning.md","url":"https://aclanthology.org/2024.findings-acl.650/"},"date_added":"2026-06-09","updated":"2026-06-09"},{"title":"Physics of Language Models: Part 3.3, Knowledge Capacity Scaling Laws","aliases":["Knowledge Capacity Scaling Laws","2 bits per parameter","Physics of LM 3.3"],"kind":"paper","category":"Pretraining","authors":"Zeyuan Allen-Zhu, Yuanzhi Li","year":2024,"venue":"ICLR 2025 (Spotlight)","peer_review":"accepted","tags":["knowledge-capacity","scaling-laws","memorization","bits-per-parameter","exposure","quantization","MoE"],"desc_html":"LM の保存知識量を bit で実測し <strong>1パラメータ＝最大2 bit<\/strong>（int8 でも維持）と確立。<strong>核心: 各知識を ~1000回露出すると 2 bit/param の高密度に到達、~100回だと容量半減<\/strong>。訓練時間・アーキテクチャ・量子化・MoE・データSNR の5因子×12結果。データ配合（Rewriting/FineData）に容量の観点を与え、保存と抽出可能性が別である点で Reversal Curse と対 (Allen-Zhu &amp; Li, 2024 / Meta FAIR)","desc_text":"LM の保存知識量を bit で実測し 1パラメータ＝最大2 bit（int8 でも維持）と確立。核心: 各知識を ~1000回露出すると 2 bit/param の高密度に到達、~100回だと容量半減。訓練時間・アーキテクチャ・量子化・MoE・データSNR の5因子×12結果。データ配合（Rewriting(papers/Pretraining/rewriting-pretraining-data.md)/FineData(papers/Pretraining/huggingface-finedata.md)）に容量の観点を与え、保存と抽出可能性が別である点で Reversal Curse(papers/Reasoning/reversal-curse.md) と対 (Allen-Zhu & Li, 2024 / Meta FAIR)","links":{"wiki":"wiki/papers/Pretraining/knowledge-capacity-scaling-laws.md","evidence":"evidence/Pretraining/knowledge-capacity-scaling-laws.md","source":"sources/Pretraining/knowledge-capacity-scaling-laws.md","url":"https://arxiv.org/abs/2404.05405"},"date_added":"2026-06-09","updated":"2026-06-09"},{"title":"Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer","aliases":["T5","Text-to-Text Transfer Transformer","C4"],"kind":"paper","category":"Pretraining","authors":"Colin Raffel, Noam Shazeer, Adam Roberts ほか","year":2020,"venue":"JMLR 2020","peer_review":"accepted","tags":["T5","transfer-learning","text-to-text","pretraining","C4","encoder-decoder","denoising-objective"],"desc_html":"NLP の全タスクを <strong>text-to-text<\/strong> に統一し、<strong>pre-training objective・アーキテクチャ・データ・転移手法<\/strong>を数十タスクで体系的にアブレーション。新データセット <strong>C4<\/strong> とスケールで要約・QA・分類など多数ベンチ SOTA。pretrain→finetune transfer の記念碑で、A Survey on Negative Transfer（転移が害になる側）の positive transfer 側の代表。C4 は FineData / Rewriting Pre-Training Data の先駆 (Raffel et al., 2020 / Google)","desc_text":"NLP の全タスクを text-to-text に統一し、pre-training objective・アーキテクチャ・データ・転移手法を数十タスクで体系的にアブレーション。新データセット C4 とスケールで要約・QA・分類など多数ベンチ SOTA。pretrain→finetune transfer の記念碑で、A Survey on Negative Transfer(papers/Surveys_Overview/survey-on-negative-transfer.md)（転移が害になる側）の positive transfer 側の代表。C4 は FineData(papers/Pretraining/huggingface-finedata.md) / Rewriting Pre-Training Data(papers/Pretraini 訳/要約 (Zhang, Liu, Cherry, Firat, 2024 / Google DeepMind)","desc_text":"ファインチューニング性能を LLMモデルサイズ・事前学習データ・finetuneパラメータ数・finetuneデータ の4因子で分析し、finetuneデータ量と各因子の間に power-based の乗法的結合スケーリング則を発見。(a) LLMモデルサイズのスケーリングが事前学習データより finetune に効く、(b) PET（prompt tuning/LoRA）のパラメータscalingは概して効きにくい、(c) 最適手法はタスク・データ量依存（低データはPET有利）。FMT vs PET 比較、1B〜16B・機械翻訳/要約 (Zhang, Liu, Cherry, Firat, 2024 / Google DeepMind)","links":{"wiki":"wiki/papers/Post_Training/scaling-llm-finetuning.md","evidence":"evidence/Post_Training/scaling-llm-finetuning.md","source":"sources/Post_Training/scaling-llm-finetuning.md","url":"https://arxiv.org/abs/2402.17193"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"How Abilities in LLMs are Affected by SFT Data Composition (DMT)","aliases":["SFT Data Composition","DMT: Dual-stage Mixed Fine-tuning","SFTデータ構成と能力"],"kind":"paper","category":"Post_Training","authors":"Guanting Dong, Hongyi Yuan, Keming Lu ほか","year":2023,"venue":"ACL 2024 (Main)","peer_review":"accepted","tags":["SFT","data-composition","catastrophic-forgetting","multi-task","DMT","math-reasoning","code-generation","instruction-following"],"desc_html":"SFTで数学・コード・一般能力はスケーリング特性が異なる（math/codeは単調向上、一般は<strong>~1000サンプルで頭打ち<\/strong>）。逐次学習は <strong>catastrophic forgetting<\/strong>、同時学習は能力 conflict。<strong>DMT<\/strong>（専門データ→一般データに専門を比率kで少量混合する2段階）で両方を緩和 (Dong et al., 2023 / Alibaba・Qwen)","desc_text":"SFTで数学・コード・一般能力はスケーリング特性が異なる（math/codeは単調向上、一般は~1000サンプルで頭打ち）。逐次学習は catastrophic forgetting、同時学習は能力 conflict。DMT（専門データ→一般データに専門を比率kで少量混合する2段階）で両方を緩和 (Dong et al., 2023 / Alibaba・Qwen)","links":{"wiki":"wiki/papers/Post_Training/sft-data-composition.md","evidence":"evidence/Post_Training/sft-data-composition.md","source":"sources/Post_Training/sft-data-composition.md","url":"https://arxiv.org/abs/2310.05492"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"BERT Rediscovers the Classical NLP Pipeline","aliases":["BERT Rediscovers the Classical NLP Pipeline","BERT pipeline","edge probing BERT layers"],"kind":"paper","category":"Pretraining","authors":"Ian Tenney, Dipanjan Das, Ellie Pavlick","year":2019,"venue":"ACL 2019","peer_review":"accepted","tags":["BERT","probing","edge-probing","interpretability","NLP-pipeline","layer-analysis","linguistic-structure"],"desc_html":"<strong>edge probing<\/strong> で BERT 各層を解析し、古典 NLP パイプライン（<strong>POS → 構文 → NER → 意味役割 → 照応<\/strong>）が期待順に層に局在＝<strong>下位層に統語・上位層に意味<\/strong>を実証。center-of-gravity と cumulative scoring の2指標、上位→下位の修正を行う「動的パイプライン」も観測。言語構造の獲得理論 の経験的対応物 (Tenney, Das, Pavlick, 2019 / Google)","desc_text":"edge probing で BERT 各層を解析し、古典 NLP パイプライン（POS → 構文 → NER → 意味役割 → 照応）が期待順に層に局在＝下位層に統語・上位層に意味を実証。center-of-gravity と cumulative scoring の2指標、上位→下位の修正を行う「動的パイプライン」も観測。言語構造の獲得理論(papers/Pretraining/language-structure-acquisition.md) の経験的対応物 (Tenney, Das, Pavlick, 2019 / Google)","links":{"wiki":"wiki/papers/Pretraining/bert-rediscovers-nlp-pipeline.md","evidence":"evidence/Pretraining/bert-rediscovers-nlp-pipeline.md","source":"sources/Pretraining/bert-rediscovers-nlp-pipeline.md","url":"https://arxiv.org/abs/1905.05950"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"data2vec: A General Framework for Self-supervised Learning in Speech, Vision and Language","aliases":["data2vec","統一自己教師あり学習","latent prediction SSL"],"kind":"paper","category":"Pretraining","authors":"Alexei Baevski, Wei-Ning Hsu, Qiantong Xu ほか","year":2022,"venue":"ICML 2022 (Oral)","peer_review":"accepted","tags":["self-supervised-learning","masked-prediction","self-distillation","latent-prediction","multimodal","EMA-teacher"],"desc_html":"音声・画像・言語に<strong>同一の自己教師ありレシピ<\/strong>を適用する統一フレームワーク。離散トークンでなく <strong>EMA teacher（self-distillation）が出す文脈化潜在表現（上位K層平均）をマスク入力から回帰予測<\/strong>。3モダリティで competitive〜SOTA（ImageNet/LibriSpeech/GLUE）。「token を捨てて自己の latent を予測する」JEPA 系設計の起点 (Baevski et al., 2022 / Meta AI)","desc_text":"音声・画像・言語に同一の自己教師ありレシピを適用する統一フレームワーク。離散トークンでなく EMA teacher（self-distillation）が出す文脈化潜在表現（上位K層平均）をマスク入力から回帰予測。3モダリティで competitive〜SOTA（ImageNet/LibriSpeech/GLUE）。「token を捨てて自己の latent を予測する」JEPA 系設計の起点 (Baevski et al., 2022 / Meta AI)","links":{"wiki":"wiki/papers/Pretraining/data2vec.md","evidence":"evidence/Pretraining/data2vec.md","source":"sources/Pretraining/data2vec.md","url":"https://arxiv.org/abs/2202.03555"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"Does BERT Rediscover a Classical NLP Pipeline?","aliases":["Does BERT Rediscover a Classical NLP Pipeline?","GridLoc probe","BERT pipeline re-examination"],"kind":"paper","category":"Pretraining","authors":"Jingcheng Niu, Wenjie Lu, Gerald Penn","year":2022,"venue":"COLING 2022","peer_review":"accepted","tags":["BERT","probing","GridLoc","interpretability","NLP-pipeline","layer-analysis","re-examination"],"desc_html":"上記の批判的再検証。<strong>層分離（表層/統語/意味）には決定的な経験的支持が乏しく<\/strong> probe 方法論・指標に敏感と指摘。<strong>GridLoc<\/strong>（トークン位置・訓練ラウンド・乱数シードを考慮）を提案し、層深さに頼らないより強い規則性を検出。「BERT の言語構造は実在するが層深さは最良の説明軸でない」 (Niu, Lu, Penn, 2022 / Toronto大)","desc_text":"上記の批判的再検証。層分離（表層/統語/意味）には決定的な経験的支持が乏しく probe 方法論・指標に敏感と指摘。GridLoc（トークン位置・訓練ラウンド・乱数シードを考慮）を提案し、層深さに頼らないより強い規則性を検出。「BERT の言語構造は実在するが層深さは最良の説明軸でない」 (Niu, Lu, Penn, 2022 / Toronto大)","links":{"wiki":"wiki/papers/Pretraining/does-bert-rediscover-nlp-pipeline.md","evidence":"evidence/Pretraining/does-bert-rediscover-nlp-pipeline.md","source":"sources/Pretraining/does-bert-rediscover-nlp-pipeline.md","url":"https://aclanthology.org/2022.coling-1.278/"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"Towards a theory of how the structure of language is acquired by deep neural networks","aliases":["language structure acquisition theory","token correlations grammar depth","言語構造の獲得理論"],"kind":"paper","category":"Pretraining","authors":"Francesco Cagnetta, Matthieu Wyart","year":2024,"venue":"NeurIPS 2024","peer_review":"accepted","tags":["PCFG","language-acquisition","token-correlations","context-window","scaling-law","hierarchical-representation","random-hierarchy-model"],"desc_html":"RHM を LM に展開。<strong>PCFG 上で token-token 相関を解析的に導出<\/strong>し、相関 range が長いほど深い隠れ変数に対応。<strong>有限の訓練集合は相関解像度を effective range に制限<\/strong>し、range はデータ量とともに伸びる → <strong>データを増やすほど文法のより深い表現を獲得<\/strong>。テスト損失のスケーリング則が<strong>文脈窓長に依存<\/strong>することを予測し Shakespeare/Wikipedia で検証。経験的スケーリング則に機序的説明を与える (Cagnetta &amp; Wyart, 2024 / EPFL)","desc_text":"RHM を LM に展開。PCFG 上で token-token 相関を解析的に導出し、相関 range が長いほど深い隠れ変数に対応。有限の訓練集合は相関解像度を effective range に制限し、range はデータ量とともに伸びる → データを増やすほど文法のより深い表現を獲得。テスト損失のスケーリング則が文脈窓長に依存することを予測し Shakespeare/Wikipedia で検証。経験的スケーリング則に機序的説明を与える (Cagnetta & Wyart, 2024 / EPFL)","links":{"wiki":"wiki/papers/Pretraining/language-structure-acquisition.md","evidence":"evidence/Pretraining/language-structure-acquisition.md","source":"sources/Pretraining/language-structure-acquisition.md","url":"https://arxiv.org/abs/2406.00048"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"Learn from your own latents and not from tokens: A sample-complexity theory","aliases":["Learn from your own latents","latent prediction sample complexity","latent予測のサンプル複雑度"],"kind":"paper","category":"Pretraining","authors":"Daniel J. Korchinski, Alessandro Favero, Matthieu Wyart","year":2026,"venue":"","peer_review":"preprint","tags":["self-supervised-learning","sample-complexity","latent-prediction","PCFG","random-hierarchy-model","data2vec","JEPA","theory"],"desc_html":"なぜ latent 予測 SSL が token 予測よりデータ効率が良いかを理論証明。<strong>PCFG（深さLの隠れ木）<\/strong>で、token/教師あり学習は木の復元に <strong>Lについて指数的サンプル<\/strong>を要するが <strong>latent 予測は定数（対数因子まで）<\/strong>。data2vec の初サンプル複雑度解析を与え「暗黙的に階層的 latent 予測を行う」と示し、<strong>H-JEPA の明示的階層は冗長<\/strong>と示唆 (Korchinski, Favero, Wyart, 2026)","desc_text":"なぜ latent 予測 SSL が token 予測よりデータ効率が良いかを理論証明。PCFG（深さLの隠れ木）で、token/教師あり学習は木の復元に Lについて指数的サンプルを要するが latent 予測は定数（対数因子まで）。data2vec の初サンプル複雑度解析を与え「暗黙的に階層的 latent 予測を行う」と示し、H-JEPA の明示的階層は冗長と示唆 (Korchinski, Favero, Wyart, 2026)","links":{"wiki":"wiki/papers/Pretraining/latent-sample-complexity.md","evidence":"evidence/Pretraining/latent-sample-complexity.md","source":"sources/Pretraining/latent-sample-complexity.md","url":"https://arxiv.org/abs/2605.27734"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"How Deep Neural Networks Learn Compositional Data: The Random Hierarchy Model","aliases":["Random Hierarchy Model","RHM","ランダム階層モデル"],"kind":"paper","category":"Pretraining","authors":"Leonardo Petrini, Francesco Cagnetta, Umberto M. Tomasini ほか","year":2023,"venue":"Physical Review X 14, 031001 (2024)","peer_review":"accepted","tags":["random-hierarchy-model","compositional-data","sample-complexity","hierarchical-representation","PCFG","feature-learning","curse-of-dimensionality"],"desc_html":"「なぜ深層ネットは高次元データを少数例で学べるか」を合成タスク <strong>RHM<\/strong>（言語・画像の階層構造を模した PCFG）で解析。深い CNN のサンプル複雑度は **P\\* = n_c · m^L<strong>（n_c=クラス数, m=multiplicity, L=深さ）で、入力次元 d=s^L に対し<\/strong>多項式<strong>＝次元の呪いを回避（浅いネットは指数的＝深さが本質）。学習は「<\/strong>同義（synonyms）の交換に不変な表現**を段階構築」する過程で、低レベル特徴とクラスの相関がノイズを超える点が閾値。本リポジトリの RHM 系（latent-sample-complexity / language-structure）の起点 (Petrini, Cagnetta, Tomasini, Favero, Wyart, 2023 / EPFL)","desc_text":"「なぜ深層ネットは高次元データを少数例で学べるか」を合成タスク RHM（言語・画像の階層構造を模した PCFG）で解析。深い CNN のサンプル複雑度は P\\ = n_c · m^L（n_c=クラス数, m=multiplicity, L=深さ）で、入力次元 d=s^L に対し多項式＝次元の呪いを回避（浅いネットは指数的＝深さが本質）。学習は「同義（synonyms）の交換に不変な表現を段階構築」する過程で、低レベル特徴とクラスの相関がノイズを超える点が閾値。本リポジトリの RHM 系（latent-sample-complexity / language-structure）の起点 (Petrini, Cagnetta, Tomasini, Favero, Wyart, 2023 / EPFL)","links":{"wiki":"wiki/papers/Pretraining/random-hierarchy-model.md","evidence":"evidence/Pretraining/random-hierarchy-model.md","source":"sources/Pretraining/random-hierarchy-model.md","url":"https://arxiv.org/abs/2307.02129"},"date_added":"2026-06-03","updated":"2026-06-03"},{"title":"Curriculum Instruction Tuning：難易度順序づけによる指示調整","aliases":["curriculum instruction tuning","カリキュラム指示調整","data curriculum for SFT"],"kind":"topic","category":"Post_Training","authors":"Emergen "sources/Agent_ToolUse/rag-vs-agentic-search.md","url":"https://zenn.dev/microsoft/articles/d1aa5068b432f9"},"date_added":"2026-05-29","updated":"2026-05-29"},{"title":"Transformers are Inherently Succinct","aliases":["Transformer succinctness","UHAT vs LTL vs finite automata","Transformer 表現力の簡潔性"],"kind":"paper","category":"Architecture","authors":"Pascal Bergsträßer, Ryan Cotterell, Anthony W. Lin","year":2025,"venue":"ICLR 2026 (Oral, Outstanding Paper)","peer_review":"accepted","tags":["transformer-expressivity","succinctness","formal-language-theory","LTL","finite-automata","RNN","UHAT","EXPSPACE","theory"],"desc_html":"Transformer の表現力を <strong>succinctness（簡潔性）<\/strong> で測り、固定精度 UHAT が同じ形式言語を <strong>LTL より指数・有限オートマトンより二重指数・固定精度 RNN より指数<\/strong> 簡潔に表現できる階層を構成的に証明。さらに非空性・等価性判定は <strong>EXPSPACE-complete<\/strong>（検証は本質的に困難）。前提は unique hard-attention (Bergsträßer, Cotterell, Lin, 2025 / RPTU Kaiserslautern × ETH Zürich)","desc_text":"Transformer の表現力を succinctness（簡潔性） で測り、固定精度 UHAT が同じ形式言語を LTL より指数・有限オートマトンより二重指数・固定精度 RNN より指数 簡潔に表現できる階層を構成的に証明。さらに非空性・等価性判定は EXPSPACE-complete（検証は本質的に困難）。前提は unique hard-attention (Bergsträßer, Cotterell, Lin, 2025 / RPTU Kaiserslautern × ETH Zürich)","links":{"wiki":"wiki/papers/Architecture/transformers-are-inherently-succinct.md","evidence":"evidence/Architecture/transformers-are-inherently-succinct.md","source":"sources/Architecture/transformers-are-inherently-succinct.md","url":"https://arxiv.org/abs/2510.19315"},"date_added":"2026-05-29","updated":"2026-05-29"},{"title":"BlueprintSymVL: A discriminative benchmark for VLM symbol recognition in engineering blueprints","aliases":["BlueprintSymVL","VLM blueprint symbol recognition benchmark"],"kind":"paper","category":"Evaluation","authors":"Vasil Shteriyanov, Rimma Dzhusupova, Jan Bosch ほか","year":2025,"venue":"Results in Engineering 28 (2025) 108171","peer_review":"accepted","tags":["VLM","benchmark","engineering","blueprint","P&ID","symbol-recognition","in-context-lear _ToolUse/vector-db-to-agent-runtime.md","source":"sources/Agent_ToolUse/vector-db-to-agent-runtime.md","url":"https://zenn.dev/mofuteq/articles/8a2193df98ac05"},"date_added":"2026-05-27","updated":"2026-05-27"},{"title":"Your Evals Will Break and You Won't See It Coming","aliases":["Your Evals Will Break","eval phase transition","self-evolving evaluation"],"kind":"paper","category":"Evaluation","authors":"Lun Wang","year":2026,"venue":"","peer_review":"n/a","tags":["evaluation","benchmark","emergent-capabilities","grokking","phase-transition","order-parameter","self-evolving-evaluation","AI-safety"],"desc_html":"評価インフラは「次世代モデル=現行の強化版」を暗黙前提に置くため、創発・grokking 的な能力相転移で予測不能に破綻すると警鐘。物理の <strong>秩序パラメータ<\/strong>概念で能力遷移を捕捉する <strong>自己進化型評価<\/strong> を提唱、「評価は訓練目標の上流」と指摘 (Wang, 2026 / DeepMind → NVIDIA)","desc_text":"評価インフラは「次世代モデル=現行の強化版」を暗黙前提に置くため、創発・grokking 的な能力相転移で予測不能に破綻すると警鐘。物理の 秩序パラメータ概念で能力遷移を捕捉する 自己進化型評価 を提唱、「評価は訓練目標の上流」と指摘 (Wang, 2026 / DeepMind → NVIDIA)","links":{"wiki":"wiki/papers/Evaluation/your-evals-will-break.md","evidence":"evidence/Evaluation/your-evals-will-break.md","source":"sources/Evaluation/your-evals-will-break.md","url":"https://wanglun1996.github.io/blog/your-evals-will-break.html"},"date_added":"2026-05-19","updated":"2026-05-19"},{"title":"Learning, Fast and Slow: Towards LLMs That Adapt Continually","aliases":["Fast-Slow Training","FST","Learning Fast and Slow","FST (Tiwari et al. 2026)"],"kind":"paper","category":"RL","authors":"Rishabh Tiwari, Kusha Sareen, Lakshya A Agrawal ほか","year":2026,"venue":"","peer_review":"preprint","tags":["RL","continual-learning","post-training","fast-slow-weights","prompt-optimization","GEPA","GRPO","CISPO","KL-divergence","drift","plasticity","sample-efficiency","Pareto-frontier"],"desc_html":"<strong>Fast-Slow Training (FST)<\/strong> = parameter θ を slow weights（GRPO+CISPO）、prompt Φ を fast weights（GEPA = Reflective Prompt Evolution）として interleave 最適化。RL 単独比 <strong>最大3倍のサンプル効率<\/strong>＋asymptote も上回り、継続学習で RL が stall する設定でも near-peak を維持 (Tiwari et al., 2026 / UC Berkeley × Mila × UT Austin)","desc_text":"Fast-Slow Training (FST) = parameter θ を slow weights（GRPO+CISPO）、prompt Φ を fast weights（GEPA = Reflective Prompt Evolution）として interleave 最適化。RL 単独比 最大3倍のサンプル効率＋asymptote も上回り、継続学習で RL が stall する設定でも near-peak を維持 (Tiwari et al., 2026 / UC Berkeley × Mila × UT Austin)","links":{"wiki":"wiki/papers/RL/learning-fast-and-slow.md","evidence":"evidence/RL/learning-fast-and-slow.md","source":"sources/RL/learning-fast-and-slow.md","url":"https://arxiv.org/abs/2605.12484"},"date_added":"2026-05-19","updated":"2026-05-19"},{"title":"SFT Memorizes, RL Generalizes: A Comparative Study of Foundation Model Post-training","aliases":["SFTvsRL","SFT Memorizes RL Generalizes","Chu et al. 2025"],"kind":"paper","category":"RL","authors":"Tianzhe Chu, Yuexiang Zhai, Jihan Yang ほか","year":2025,"venue":"ICML 2025 (PMLR 267)","peer_review":"accepted","tags":["RL","SFT","post-training","generalization","memorization","out-of-distribution","PPO","outcome-based-reward","multimodal","V-IRL","GeneralPoints"],"desc_html":"SFT/RL を <strong>memorization vs generalization<\/strong> 軸で実証対比。GeneralPoints / V-IRL の rule・visual OOD で RL は汎化・SFT は ID 過適合（極端な暗記）、V-IRL Visual OOD で <strong>+33.8pt SOTA<\/strong>。ただし指示追従できない backbone への直接 RL は失敗し SFT 前段が必要 (Chu et al., 2025 / UC Berkeley × HKU × Google DeepMind × U Alberta)","desc_text":"SFT/RL を memorization vs generalization 軸で実証対比。GeneralPoints / V-IRL の rule・visual OOD で RL は汎化・SFT は ID 過適合（極端な暗記）、V-IRL Visual OOD で +33.8pt SOTA。ただし指示追従できない backbone への直接 RL は失敗し SFT 前段が必要 (Chu et al., 2025 / UC Berkeley × HKU × Google DeepMind × U Alberta)","links":{"wiki":"wiki/papers/RL/sft-memorizes-rl-generalizes.md","evidence":"evidence/RL/sft-memorizes-rl-generalizes.md","source":"sources/RL/sft-memorizes-rl-generalizes.md","url":"https://arxiv.org/abs/2501.17161"},"date_added":"2026-05-19","updated":"2026-05-19"},{"title":"Gated Delta Networks: Improving Mamb i":"wiki/topics/Reasoning/llm-logical-understanding-wall.md"},"date_added":"","updated":"2026-06-09"},{"title":"Claude Mythos Preview","aliases":["Mythos","Project Glasswing"],"kind":"model","category":"Models","authors":"","year":null,"venue":"","peer_review":"n/a","tags":["claude","anthropic","mythos","agentic-coding","cybersecurity","benchmark"],"desc_html":"Opus 4.6を大幅に上回るagentic coding/cyber性能、防御用途限定 (Anthropic, 2026)","desc_text":"Opus 4.6を大幅に上回るagentic coding/cyber性能、防御用途限定 (Anthropic, 2026)","links":{"wiki":"wiki/models/claude-mythos-preview.md"},"date_added":"","updated":"2026-04-08"}];
const PR_LABEL = {accepted:"査読採択", workshop:"workshop", "under-review":"査読中", preprint:"preprint", "n/a":"—"};
const KIND_LABEL = {paper:"", topic:"トピック", model:"モデル"};

// 検索用テキストを事前計算
for (const r of DATA){
  r._search = [r.title, (r.aliases||[]).join(" "), r.authors, r.venue,
               (r.tags||[]).join(" "), r.desc_text, r.category].join("  ").toLowerCase();
}

const state = {q:"", cats:new Set(), prs:new Set(), sort:"added"};
const $ = s => document.querySelector(s);

// --- フィルタ用チップ生成（件数付き） ---
function counts(key){
  const m = new Map();
  for (const r of DATA){ const v=r[key]||"n/a"; m.set(v,(m.get(v)||0)+1); }
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || String(a[0]).localeCompare(String(b[0])));
}
function renderChips(el, entries, set, fmt){
  el.innerHTML="";
  for (const [val,n] of entries){
    const c=document.createElement("button");
    c.className="chip"+(set.has(val)?" on":"");
    c.innerHTML = (fmt?fmt(val):val)+' <span class="n">'+n+'</span>';
    c.onclick=()=>{ set.has(val)?set.delete(val):set.add(val); c.classList.toggle("on"); render(); };
    el.appendChild(c);
  }
}
renderChips($("#catChips"), counts("category"), state.cats);
renderChips($("#prChips"), counts("peer_review"), state.prs, v=>PR_LABEL[v]||v);

// --- 曖昧検索: トークンごとに 部分一致 or 部分列一致（AND）、タイトル一致を加点 ---
function subseq(token, text){ let i=0; for(const ch of text){ if(ch===token[i]) i++; if(i===token.length) return true; } return token.length===0; }
function scoreToken(token, r){
  const t=r.title.toLowerCase(), s=r._search;
  let sc=0;
  const it=t.indexOf(token); if(it===0) sc+=120; else if(it>0) sc+=80;
  const is=s.indexOf(token); if(is>=0) sc+=40+Math.max(0,20-is/10);
  else if(subseq(token,s)) sc+=15; else if(sc===0) return -1;
  return sc;
}
function matchScore(r){
  if(!state.q) return 0;
  const toks=state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let total=0;
  for(const tk of toks){ const sc=scoreToken(tk,r); if(sc<0) return -1; total+=sc; }
  return total;
}

function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(s){ // 検索語をハイライト（プレーンテキストに対して）
  if(!state.q) return esc(s);
  const toks=state.q.toLowerCase().split(/\s+/).filter(Boolean).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!toks.length) return esc(s);
  let out=esc(s);
  for(const tk of toks){ try{ out=out.replace(new RegExp('('+tk+')','gi'),'<mark>$1</mark>'); }catch(e){} }
  return out;
}

function card(r){
  const el=document.createElement("article"); el.className="card";
  const kindBadge = KIND_LABEL[r.kind] ? '<span class="badge b-kind">'+KIND_LABEL[r.kind]+'</span>' : '';
  const prCls = "pr-"+String(r.peer_review).replace("/","").replace("n/a","na");
  const prBadge = '<span class="pr '+prCls+'">'+(PR_LABEL[r.peer_review]||r.peer_review)+'</span>';
  const yv = [r.year, r.venue].filter(Boolean).join(" · ");
  const metaBits = [r.authors, yv].filter(Boolean).join(" — ");
  const L=r.links, linkbits=[];
  if(L.wiki) linkbits.push('<a href="'+L.wiki+'">📄 wiki</a>');
  if(L.evidence) linkbits.push('<a href="'+L.evidence+'">🧾 evidence</a>');
  if(L.source) linkbits.push('<a href="'+L.source+'">📌 source</a>');
  if(L.url) linkbits.push('<a href="'+L.url+'" target="_blank" rel="noopener">🔗 原典</a>');
  const tags=(r.tags||[]).slice(0,8).map(t=>'<span class="tag" data-t="'+esc(String(t))+'">#'+esc(String(t))+'</span>').join("");
  el.innerHTML =
    '<div class="badges"><span class="badge b-cat">'+esc(r.category)+'</span>'+kindBadge+prBadge+'</div>'+
    '<h2>'+hl(r.title)+'</h2>'+
    (metaBits?'<div class="meta">'+hl(metaBits)+'</div>':'')+
    '<div class="desc">'+r.desc_html+'</div>'+
    (tags?'<div class="tags">'+tags+'</div>':'')+
    '<div class="links">'+linkbits.join("")+'</div>';
  el.querySelectorAll('.tag').forEach(t=>t.onclick=()=>{ $("#q").value=t.dataset.t; state.q=t.dataset.t; syncClear(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
  return el;
}

function render(){
  let rows=DATA.filter(r=>{
    if(state.cats.size && !state.cats.has(r.category)) return false;
    if(state.prs.size && !state.prs.has(r.peer_review)) return false;
    return true;
  });
  if(state.q){
    rows=rows.map(r=>[r,matchScore(r)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  }else{
    const s=state.sort;
    rows=rows.slice().sort((a,b)=>{
      if(s==="title") return a.title.localeCompare(b.title,'ja');
      if(s==="year") return (b.year||0)-(a.year||0);
      if(s==="updated") return String(b.updated||"").localeCompare(String(a.updated||""));
      return String(b.date_added||"").localeCompare(String(a.date_added||"")); // added
    });
  }
  const grid=$("#grid"); grid.innerHTML="";
  const frag=document.createDocumentFragment();
  rows.forEach(r=>frag.appendChild(card(r)));
  grid.appendChild(frag);
  $("#empty").style.display = rows.length? "none":"block";
  $("#count").textContent = rows.length+" / "+DATA.length+" 件";
}

// --- events ---
function syncClear(){ $("#clear").style.display = $("#q").value? "block":"none"; }
$("#q").addEventListener("input", e=>{ state.q=e.target.value.trim(); syncClear(); render(); });
$("#clear").onclick=()=>{ $("#q").value=""; state.q=""; syncClear(); render(); $("#q").focus(); };
$("#sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });
$("#reset").onclick=()=>{ state.cats.clear(); state.prs.clear();
  document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); render(); };
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && document.activeElement===$("#q")){ $("#clear").click(); }
});
// テーマ
const root=document.documentElement;
const saved=localStorage.getItem("rw-theme"); if(saved) root.setAttribute("data-theme",saved);
$("#theme").onclick=()=>{ const d=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",d); localStorage.setItem("rw-theme",d); };

render();
</script>
